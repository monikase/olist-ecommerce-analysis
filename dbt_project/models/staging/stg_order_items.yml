version: 2

models:

  - name: stg_order_items

    description: >
      Item-level staging model containing products and sellers
      associated with each order.

    columns:

      - name: order_id
        description: "Identifier of the order."
        data_tests:
          - not_null

      - name: order_item_id
        description: "Sequential item number within an order."
        data_tests:
          - not_null

      - name: product_id
        description: "Identifier of the purchased product."
        data_tests:
          - not_null

      - name: seller_id
        description: "Identifier of the seller."
        data_tests:
          - not_null

      - name: price
        description: "Price paid for the item."
        data_tests:
          - not_null

      - name: freight_value
        description: "Freight value charged for the item."
        data_tests:
          - not_null